    <!--
      GitHub Pages SPA redirect trick. 404.html stashes the requested path and
      bounces to /, then this restores it so React Router can take over.
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="application/ld+json">

        "sameAs": [
          "https://github.com/erfanmohammadi1998",
          "https://www.linkedin.com/in/erfan-mohammadi77/"
        ]
      }
    </script>

    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
